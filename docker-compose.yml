version: '3.9'

services:
  # ─── Base de Datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sistema-ti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ti_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_ti}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ti_user} -d ${POSTGRES_DB:-sistema_ti}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sistema-ti-network

  # ─── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: sistema-ti-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ti_user}:${POSTGRES_PASSWORD:-ti_secret}@postgres:5432/${POSTGRES_DB:-sistema_ti}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - sistema-ti-network
    profiles:
      - full

  # ─── Frontend SPA ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: sistema-ti-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'
    networks:
      - sistema-ti-network
    profiles:
      - full

volumes:
  postgres_data:
    name: sistema-ti-postgres-data

networks:
  sistema-ti-network:
    name: sistema-ti-network
    driver: bridge
